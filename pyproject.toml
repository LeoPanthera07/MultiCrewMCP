[project]
name = "ops-assistant"
version = "0.1.0"
description = "Operations Assistant - CrewAI & MCP Mini-Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "crewai>=0.80.0",
    "crewai-tools[mcp]>=0.14.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (require Ollama, deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["crew", "server"]


